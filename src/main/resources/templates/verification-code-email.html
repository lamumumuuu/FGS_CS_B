<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>验证码</title>
</head>
<body style="font-family: Arial, 'Microsoft YaHei', sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; display: flex; justify-content: center; align-items: center; height: 100vh;">
<div style="width: 100%; max-width: 600px; margin: 20px auto; background-color: #1a1a1a; color: #dddddd; padding: 40px; text-align: center; border-radius: 8px;">

    <h1 style="font-size: 28px; color: #ffffff; margin-bottom: 30px;">验证码</h1>

    <div style="text-align: left;">
        <p style="font-size: 16px; line-height: 1.6;">亲爱的用户：</p>
        <p style="font-size: 16px; line-height: 1.6;">您正在进行身份验证，以下是您的验证码：</p>
    </div>

    <div style="padding: 20px 0;">
        <span th:text="${verificationCode}" style="font-size: 36px; font-weight: bold; letter-spacing: 8px; color: #ffffff; background-color: #333; padding: 10px 20px; border-radius: 5px; display: inline-block;">123456</span>
    </div>

    <p style="font-size: 16px; line-height: 1.6;">验证码有效期为 <span th:text="${expireTime}">5</span> 分钟，请尽快使用。</p>

    <div style="margin-top: 30px; font-size: 14px; color: #888888; text-align: left;">
        <p>如果您没有请求此验证码，请忽略此邮件。</p>
        <p>请勿将验证码泄露给他人，以保障您的账号安全。</p>
    </div>

    <div style="margin-top: 40px; font-size: 12px; color: #666666;">
        <p>&copy; 2026 计算机协会版权所有</p>
    </div>

</div>
</body>
</html>
