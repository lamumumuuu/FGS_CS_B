# Redis配置
spring:
  data:
    redis:
      host: localhost
      port: 6379
      password: 
      database: 0
      timeout: 2000ms  # 连接超时时间
      connect-timeout: 2000ms  # 连接建立超时时间
      lettuce:
        pool:
          max-active: 8  # 最大连接数
          max-idle: 8    # 最大空闲连接数
          min-idle: 0    # 最小空闲连接数
          max-wait: -1ms # 连接池最大阻塞等待时间，-1表示无限制
        shutdown-timeout: 100ms # 关闭超时时间